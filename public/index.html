<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verbal — WhatsApp CRM</title>
<style>
:root{
  --brand:#0f766e; --brand-dark:#115e59; --brand-tint:#e6f4f1;
  --wa:#25d366; --wa-bubble:#e7f8ef; --line:#eceef0;
  --text:#111827; --muted:#6b7280;
  --bg:#ffffff; --bg-soft:#f9fafb; --amber:#b45309; --amber-tint:#fef3c7;
  --red:#b91c1c; --red-tint:#fee2e2; --grey-tint:#f3f4f6;
  --radius:10px; --btn-radius:7px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
.hidden{display:none !important}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--btn-radius);
  border:1px solid var(--line);background:#fff;color:var(--text);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--bg-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.danger{color:var(--red);border-color:#f1d3d3}
.btn.danger:hover{background:var(--red-tint)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--grey-tint);color:var(--muted)}
.chip.green{background:var(--brand-tint);color:var(--brand-dark)}
.chip.red{background:var(--red-tint);color:var(--red)}
.chip.amber{background:var(--amber-tint);color:var(--amber)}
.chip.wa{background:var(--wa-bubble);color:#0b7a3b}

/* Inputs */
.field{display:block;margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.input,.select,textarea.input{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--btn-radius);background:#fff;outline:none}
textarea.input{height:auto;min-height:80px;padding:9px 11px;resize:vertical}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--brand)}

/* Cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:16px}

/* Tables */
table.tbl{width:100%;border-collapse:collapse;background:#fff}
table.tbl th{background:var(--bg-soft);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:hover td{background:var(--bg-soft)}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
/* Icon rail */
.rail{width:56px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;
  transition:width .16s ease;overflow:hidden;flex-shrink:0;z-index:30}
.rail:hover{width:224px;box-shadow:2px 0 14px rgba(0,0,0,.05)}
.rail .ws{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:600}
.rail .ws .emoji{font-size:20px;flex-shrink:0}
.rail .ws .nm{white-space:nowrap;opacity:0;transition:opacity .16s}
.rail:hover .ws .nm{opacity:1}
.rail .nav{flex:1;overflow-y:auto;padding:8px 0}
.rail .grp{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#9aa1ab;padding:12px 18px 4px;white-space:nowrap;opacity:0;transition:opacity .16s}
.rail:hover .grp{opacity:1}
.navitem{display:flex;align-items:center;gap:14px;height:40px;padding:0 18px;color:var(--muted);white-space:nowrap;cursor:pointer;border-left:3px solid transparent}
.navitem .ic{width:20px;text-align:center;flex-shrink:0;font-size:16px}
.navitem .lbl{opacity:0;transition:opacity .16s}
.rail:hover .navitem .lbl{opacity:1}
.navitem:hover{background:var(--bg-soft);color:var(--text)}
.navitem.active{background:var(--brand-tint);color:var(--brand-dark);border-left-color:var(--brand);font-weight:600}
.rail .me{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.rail .me .txt{opacity:0;transition:opacity .16s;overflow:hidden}
.rail:hover .me .txt{opacity:1}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;background:#fff}
.topbar .title{font-size:16px;font-weight:600}
.topbar .sub{font-size:12px;color:var(--muted)}
.wa-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff}
.wa-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.wa-pill.demo{background:var(--amber-tint);color:var(--amber);border-color:#f6e3b0}
.wa-pill.demo .dot{background:var(--amber)}
.wa-pill.live{background:var(--wa-bubble);color:#0b7a3b;border-color:#bfe9cf}
.wa-pill.live .dot{background:var(--wa)}

.impersonate-banner{background:#0b1324;color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;font-size:13px}
.impersonate-banner .btn{height:30px}

.content{flex:1;overflow-y:auto;padding:22px 24px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:18px;margin:0;font-weight:600}
.filter-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}

/* Avatar */
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-tint);color:var(--brand-dark);display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;font-size:14px}
.avatar.sm{width:30px;height:30px;font-size:12px}
.avatar.lg{width:48px;height:48px;font-size:17px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:600;margin-top:6px}

/* Empty */
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty a{font-weight:600}

/* Banner */
.banner{background:var(--amber-tint);color:var(--amber);border:1px solid #f6e3b0;border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;font-size:13px;display:flex;gap:10px;align-items:center}

/* Pipeline chart */
.pipeline{display:flex;align-items:flex-end;gap:18px;height:180px;padding:10px 4px 0}
.pipeline .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pipeline .bar{width:100%;max-width:66px;background:var(--brand);border-radius:6px 6px 0 0;min-height:4px;transition:height .3s}
.pipeline .cnt{font-weight:600;margin-bottom:6px}
.pipeline .lab{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}

/* Auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f4faf8,#ffffff);padding:20px}
.auth-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px}
.auth-logo{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:600;margin-bottom:4px}
.auth-logo .tick{color:var(--wa)}
.auth-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--grey-tint);padding:4px;border-radius:9px}
.auth-tabs button{flex:1;height:34px;border:none;background:transparent;border-radius:7px;color:var(--muted);font-weight:600}
.auth-tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.firstrun-note{background:var(--brand-tint);color:var(--brand-dark);padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:16px}
.err{color:var(--red);font-size:13px;margin-bottom:12px;min-height:16px}

/* Chats layout */
.chats{display:flex;height:100%;min-height:0}
.col-filters{width:236px;border-right:1px solid var(--line);flex-shrink:0;overflow-y:auto;padding:10px}
.col-list{width:340px;border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;min-height:0}
.col-convo{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-soft)}
.col-details{width:300px;border-left:1px solid var(--line);flex-shrink:0;overflow-y:auto;background:#fff}
.fitem{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:8px;cursor:pointer;color:var(--text)}
.fitem:hover{background:var(--bg-soft)}
.fitem.active{background:var(--brand-tint);color:var(--brand-dark);font-weight:600}
.fitem .badge{background:#e5e7eb;color:var(--muted);border-radius:999px;font-size:11px;padding:1px 8px;font-weight:600}
.fitem.active .badge{background:var(--brand);color:#fff}
.fsep{height:1px;background:var(--line);margin:9px 4px}
.list-head{padding:12px 14px;border-bottom:1px solid var(--line)}
.list-head .cnt{font-size:12px;color:var(--muted)}
.search{width:100%;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:7px;margin-top:8px}
.list-scroll{overflow-y:auto;flex:1}
.chatrow{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.chatrow:hover{background:var(--bg-soft)}
.chatrow.active{background:var(--brand-tint)}
.chatrow .body{flex:1;min-width:0}
.chatrow .top{display:flex;justify-content:space-between;gap:8px}
.chatrow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatrow .tm{font-size:11px;color:var(--muted);flex-shrink:0}
.chatrow .ph{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatrow .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.chatrow .unread{background:var(--wa);color:#fff;border-radius:999px;font-size:11px;font-weight:600;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.convo-head{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0}
.convo-head .meta{flex:1;min-width:0}
.convo-head .nm{font-weight:600}
.convo-head .ph{font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:18px 16%;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:70%;padding:8px 12px;border-radius:10px;font-size:13.5px;line-height:1.4;position:relative;word-wrap:break-word;white-space:pre-wrap}
.bubble.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.bubble.out{align-self:flex-end;background:var(--wa-bubble);border-bottom-right-radius:3px}
.bubble .meta{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;justify-content:flex-end;align-items:center}
.bubble.in .meta{justify-content:flex-start}
.bubble .sender{font-size:11px;font-weight:600;color:var(--brand-dark);margin-bottom:2px}
.note{align-self:center;max-width:80%;background:#fffbeb;border:1px dashed #f2d98d;color:var(--amber);border-radius:8px;padding:6px 12px;font-size:12px;text-align:center}
.tick{color:var(--muted)}
.tick.read{color:#34b7f1}
.composer{border-top:1px solid var(--line);background:#fff;padding:10px 14px;flex-shrink:0;position:relative}
.composer .row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:none;max-height:120px;min-height:40px;outline:none}
.qr-pop{position:absolute;bottom:64px;left:14px;right:14px;max-height:220px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20}
.qr-item{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.qr-item:hover,.qr-item.active{background:var(--brand-tint)}
.qr-item .t{font-weight:600;font-size:13px}
.qr-item .b{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-tabs{display:flex;border-bottom:1px solid var(--line)}
.detail-tabs button{flex:1;height:44px;border:none;background:#fff;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.detail-tabs button.active{color:var(--brand-dark);border-bottom-color:var(--brand)}
.detail-body{padding:16px}
.drow{margin-bottom:14px}
.drow .l{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
.tag-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag-chips .x{cursor:pointer;opacity:.6}
.tag-chips .x:hover{opacity:1}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:620px}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.x-close{border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer}

/* Toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#0b1324;color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:340px}
.toast.err{background:var(--red)}
.toast.ok{background:var(--brand-dark)}

/* misc */
.creds{background:var(--bg-soft);border:1px solid var(--line);border-radius:9px;padding:14px;font-size:13px}
.creds .r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.creds .r:last-child{border-bottom:none}
.creds code{background:#fff;border:1px solid var(--line);padding:2px 8px;border-radius:6px;font-size:13px}
.usage-bar{height:8px;background:var(--grey-tint);border-radius:999px;overflow:hidden;margin-top:6px}
.usage-bar span{display:block;height:100%;background:var(--brand)}
.usage-bar.full span{background:var(--red)}
.toggle{position:relative;width:44px;height:24px;border-radius:999px;background:#d1d5db;cursor:pointer;transition:background .15s;flex-shrink:0}
.toggle.on{background:var(--brand)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:23px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.mut{color:var(--muted)}
.sr-flex{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================ Verbal SPA ============================ */
const LS_TOKEN='verbal_token', LS_ADMIN='verbal_admin_token';
const state={ token:localStorage.getItem(LS_TOKEN)||'', adminToken:localStorage.getItem(LS_ADMIN)||'',
  me:null, view:'dashboard', chat:{view:'open', q:'', contactId:null, contacts:[], messages:[], counts:{}, tab:'details', users:[]} };

const STAGES=['New Lead','Qualified','Negotiation','Won','Cold'];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';}
function firstName(n){return String(n||'there').trim().split(/\s+/)[0];}
function fmtTime(ts){ if(!ts)return''; const d=new Date(ts.replace(' ','T')+'Z'); if(isNaN(d))return'';
  const now=new Date(); const sameDay=d.toDateString()===now.toDateString();
  if(sameDay)return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString([], {day:'2-digit',month:'short'}); }
function fmtDate(ts){ if(!ts)return'—'; const d=new Date(ts.replace(' ','T')+'Z'); if(isNaN(d))return'—';
  return d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'}); }

function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3200);}

async function api(method,path,body){
  const headers={};
  if(body!==undefined)headers['Content-Type']='application/json';
  if(state.token)headers['Authorization']='Bearer '+state.token;
  const res=await fetch(path,{method,headers,body:body!==undefined?JSON.stringify(body):undefined});
  let data=null; const txt=await res.text(); try{data=txt?JSON.parse(txt):null;}catch(_){data={_raw:txt};}
  if(res.status===401){ if(state.token){logout();} const e=new Error((data&&data.error)||'Session expired'); e.status=401; throw e; }
  if(!res.ok){ const e=new Error((data&&data.error)||('Error '+res.status)); e.status=res.status; e.data=data; throw e; }
  return data;
}
// unauthenticated helper
async function apiPublic(method,path,body){
  const res=await fetch(path,{method,headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined});
  let data=null;const txt=await res.text();try{data=txt?JSON.parse(txt):null;}catch(_){}
  if(!res.ok)throw new Error((data&&data.error)||('Error '+res.status));
  return data;
}

function setToken(t){state.token=t;localStorage.setItem(LS_TOKEN,t);}
function logout(){localStorage.removeItem(LS_TOKEN);localStorage.removeItem(LS_ADMIN);state.token='';state.adminToken='';state.me=null;location.hash='';renderAuth();}

/* ============================ Boot ============================ */
window.addEventListener('DOMContentLoaded',boot);
window.addEventListener('hashchange',()=>{ if(state.me){ const v=(location.hash||'#/dashboard').slice(2)||'dashboard'; state.view=v; renderApp(); }});
window.addEventListener('unhandledrejection',e=>{ console.error('unhandledrejection',e.reason); });

async function boot(){
  if(!state.token){ renderAuth(); return; }
  try{ state.me=await api('GET','/api/me'); const v=(location.hash||'#/dashboard').slice(2)||'dashboard'; state.view=v; renderApp(); }
  catch(e){ renderAuth(); }
}

/* ============================ Auth screen ============================ */
async function renderAuth(){
  let cfg={firstRun:false,registrationOpen:false};
  try{ cfg=await apiPublic('GET','/api/auth/config'); }catch(_){}
  const tab = cfg.firstRun?'signup':'login';
  const root=$('#root');
  root.innerHTML=`
  <div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo"><span class="tick">✔✔</span> Verbal</div>
    <div class="auth-sub">WhatsApp Business CRM</div>
    ${cfg.firstRun?'<div class="firstrun-note">First run — create your platform owner account.</div>':''}
    <div class="auth-tabs">
      <button data-tab="login" class="${tab==='login'?'active':''}">Sign in</button>
      <button data-tab="signup" class="${tab==='signup'?'active':''}">Sign up</button>
    </div>
    <div class="err" id="auth-err"></div>
    <form id="login-form" class="${tab==='login'?'':'hidden'}">
      <div class="field"><label>Email</label><input class="input" name="email" type="email" required></div>
      <div class="field"><label>Password</label><input class="input" name="password" type="password" required></div>
      <button class="btn primary" style="width:100%" type="submit">Sign in</button>
    </form>
    <form id="signup-form" class="${tab==='signup'?'':'hidden'}">
      <div class="field"><label>Workspace / company name</label><input class="input" name="companyName" required></div>
      <div class="field"><label>Your name</label><input class="input" name="name" required></div>
      <div class="field"><label>Email</label><input class="input" name="email" type="email" required></div>
      <div class="field"><label>Password</label><input class="input" name="password" type="password" minlength="6" required></div>
      <button class="btn primary" style="width:100%" type="submit">Create account</button>
      ${(!cfg.firstRun && !cfg.registrationOpen)?'<div class="mut" style="font-size:12px;margin-top:12px;text-align:center">Public sign-up is closed. Contact your administrator.</div>':''}
    </form>
  </div></div>`;
  $$('.auth-tabs button').forEach(b=>b.onclick=()=>{

async function viewDashboard(el){

/* ============================ Chats (5 columns) ============================ */
let searchTimer=null;
async function viewChats(el){
  el.style.padding='0';el.parentElement.style.padding='0';
  el.innerHTML=`<div class="chats">
    <div class="col-filters" id="col-filters"></div>
    <div class="col-list"><div class="list-head"><div style="display:flex;justify-content:space-between;align-items:center"><b id="list-title">Open</b><span class="cnt" id="list-cnt"></span></div>

  cs.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.chat.q=cs.value.trim();loadChatList();},260);};

  await Promise.all([loadCounts(),loadChatList()]);

async function loadCounts(){

  renderFilters();
}
function renderFilters(){
  const c=state.chat.counts; const v=state.chat.view;
  const item=(key,label)=>`<div class="fitem ${v===key?'active':''}" data-v="${key}"><span>${label}</span><span class="badge">${c[key]??0}</span></div>`;
  const active = state.chat.q || !['open'].includes(v) || state.chat.ownerFilter || state.chat.tagFilter;
  $('#col-filters').innerHTML=`
    ${item('open','Open')}${item('closed','Closed')}${item('awaiting','Awaiting reply')}${item('unread','Unread')}${item('all','All')}
    <div class="fsep"></div>
    ${item('mine','My chats')}${item('unassigned','Unassigned')}
    <div class="fsep"></div>
    <div class="field" style="margin:6px 4px"><label>Team member</label>
      <select class="select" id="owner-filter"><option value="">Everyone</option>${(state.chat.users||[]).map(u=>`<option value="${u.id}" ${String(state.chat.ownerFilter)===String(u.id)?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
    <div class="field" style="margin:6px 4px"><label>Tag</label>
      <input class="input" id="tag-filter" placeholder="tag" value="${esc(state.chat.tagFilter||'')}"></div>

  $('#owner-filter').onchange=(e)=>{state.chat.ownerFilter=e.target.value;loadChatList();renderFilters();};
  const tf=$('#tag-filter'); tf.onchange=(e)=>{state.chat.tagFilter=e.target.value.trim();loadChatList();renderFilters();};
  const cf=$('#clear-filters'); if(cf)cf.onclick=()=>{state.chat.view='open';state.chat.q='';state.chat.ownerFilter='';state.chat.tagFilter='';const s=$('#chat-search');if(s)s.value='';loadChatList();renderFilters();};
  $('#list-title').textContent={open:'Open',closed:'Closed',awaiting:'Awaiting reply',unread:'Unread',all:'All chats',mine:'My chats',unassigned:'Unassigned'}[v]||v;
}
async function loadChatList(){
  const list=$('#chat-list'); if(!list)return; list.innerHTML='<div class="spinner"></div>';
  const p=new URLSearchParams(); p.set('view',state.chat.view);
  if(state.chat.q)p.set('q',state.chat.q); if(state.chat.ownerFilter)p.set('owner',state.chat.ownerFilter); if(state.chat.tagFilter)p.set('tag',state.chat.tagFilter);
  try{
    const d=await api('GET','/api/contacts?'+p.toString()); state.chat.contacts=d.contacts;
    $('#list-cnt').textContent=d.contacts.length+' chat'+(d.contacts.length===1?'':'s');
    if(!d.contacts.length){list.innerHTML=`<div class="empty">No conversations here.<br><a href="#" id="sim-here">Simulate an incoming message</a></div>`;
      const s=$('#sim-here'); if(s)s.onclick=(e)=>{e.preventDefault();openSimulateModal();};return;}
    list.innerHTML=d.contacts.map(ct=>{
      const tags=(ct.tags||[]).slice(0,2).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
      return `<div class="chatrow ${state.chat.contactId===ct.id?'active':''}" data-id="${ct.id}">
        <div class="avatar">${initials(ct.name)}</div>
        <div class="body"><div class="top"><span class="nm">${esc(ct.name)}</span><span class="tm">${fmtTime(ct.last_message_at)}</span></div>
        <div class="ph">${esc(ct.phone||'')} ${ct.last_direction==='out'?'<span class="tick">✓✓</span>':''}</div>
        <div class="tags">${tags}${ct.status==='closed'?'<span class="chip green">Resolved</span>':''}</div></div>
        ${ct.unread>0?`<span class="unread">${ct.unread}</span>`:''}</div>`;}).join('');
    $$('#chat-list .chatrow').forEach(r=>r.onclick=()=>{state.chat.contactId=parseInt(r.dataset.id,10);openContact();});
  }catch(e){list.innerHTML=errBox(e);}
}
async function openContact(){
  $$('#chat-list .chatrow').forEach(r=>r.classList.toggle('active',parseInt(r.dataset.id,10)===state.chat.contactId));
  const convo=$('#col-convo'); convo.innerHTML='<div class="spinner"></div>';
  try{
    const d=await api('GET','/api/messages/'+state.chat.contactId);
    state.chat.messages=d.messages; state.chat.current=d.contact;
    // update unread badge locally
    const row=state.chat.contacts.find(c=>c.id===state.chat.contactId); if(row)row.unread=0;
    const badge=$(`#chat-list .chatrow[data-id="${state.chat.contactId}"] .unread`); if(badge)badge.remove();
    renderConvo(); renderDetails();
  }catch(e){convo.innerHTML=errBox(e);}
}
function renderConvo(){
  const convo=$('#col-convo'); if(!convo)return;
  const ct=state.chat.current;
  if(!ct){convo.innerHTML='<div class="empty" style="margin:auto">Select a conversation to start messaging.<br><a href="#" id="sim-empty">Simulate an incoming message</a></div>';
    const s=$('#sim-empty');if(s)s.onclick=(e)=>{e.preventDefault();openSimulateModal();};return;}
  const closed=ct.status==='closed';
  convo.innerHTML=`
    <div class="convo-head"><div class="avatar">${initials(ct.name)}</div>
      <div class="meta"><div class="nm">${esc(ct.name)}</div><div class="ph">${esc(ct.phone||'')}</div></div>
      <select class="select" id="assignee" style="width:150px;height:34px">
        <option value="">Unassigned</option>
        ${(state.chat.users||[]).map(u=>`<option value="${u.id}" ${String(ct.owner_user_id)===String(u.id)?'selected':''}>${esc(u.name)}</option>`).join('')}</select>
      <button class="btn sm ${closed?'':'primary'}" id="resolve-btn">${closed?'Reopen':'Resolve'}</button>
    </div>
    <div class="msgs" id="msgs">${renderMsgs(state.chat.messages)}</div>
    <div class="composer">
      <div class="qr-pop hidden" id="qr-pop"></div>
      <div class="row">
        <button class="btn" id="qr-btn" title="Quick replies">⚡</button>
        <textarea id="composer-input" placeholder="Type a message…  (press / for quick replies)" rows="1"></textarea>
        <button class="btn primary" id="send-btn">Send</button>
      </div>
    </div>`;
  const m=$('#msgs'); m.scrollTop=m.scrollHeight;
  $('#resolve-btn').onclick=async()=>{ try{ const r=await api('POST','/api/contacts/'+ct.id+'/status',{status:closed?'open':'closed'});
    state.chat.current=r.contact; toast(closed?'Conversation reopened':'Conversation resolved','ok'); await openContact(); loadCounts(); loadChatList(); }catch(e){toast(e.message,'err');} };
  $('#assignee').onchange=async(e)=>{ try{ await api('PATCH','/api/contacts/'+ct.id,{owner_user_id:e.target.value||null}); ct.owner_user_id=e.target.value||null; toast('Assignee updated','ok'); loadCounts(); }catch(err){toast(err.message,'err');} };
  const input=$('#composer-input');
  input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';handleQR(input);};
  input.onkeydown=(e)=>{ const pop=$('#qr-pop');
    if(!pop.classList.contains('hidden')){
      if(e.key==='Escape'){pop.classList.add('hidden');e.preventDefault();return;}
      if(e.key==='Enter'){const first=$('.qr-item',pop);if(first){e.preventDefault();first.click();return;}}
    }
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}};
  $('#send-btn').onclick=sendMessage;
  $('#qr-btn').onclick=()=>{input.value='/';handleQR(input);input.focus();};
}
function renderMsgs(msgs){
  if(!msgs.length)return '<div class="empty" style="margin:auto">No messages yet. Say hello 👋</div>';
  return msgs.map(mm=>{
    if(mm.direction==='note')return `<div class="note">📝 ${esc(mm.body)} <span style="opacity:.7">· ${fmtTime(mm.created_at)}</span></div>`;
    const out=mm.direction==='out';
    const tick=out?tickFor(mm.status):'';
    return `<div class="bubble ${out?'out':'in'}">
      ${out&&mm.sender_name?`<div class="sender">${esc(mm.sender_name)}</div>`:''}
      ${esc(mm.body)}
      <div class="meta">${fmtTime(mm.created_at)} ${tick}</div></div>`;}).join('');
}
function tickFor(s){ if(s==='read')return '<span class="tick read">✓✓</span>'; if(s==='delivered')return '<span class="tick">✓✓</span>';
  if(s==='sent')return '<span class="tick">✓</span>'; if(s==='failed')return '<span style="color:var(--red)">⚠ failed</span>';
  return '<span class="tick" title="Demo — not sent to WhatsApp">· demo</span>'; }
async function sendMessage(){
  const input=$('#composer-input'); const body=input.value.trim(); if(!body)return;
  $('#qr-pop').classList.add('hidden');
  try{ const r=await api('POST','/api/messages/'+state.chat.contactId,{body,direction:'out'});
    state.chat.messages.push(r.message); if(r.contact)state.chat.current=r.contact;
    input.value='';input.style.height='auto'; $('#msgs').innerHTML=renderMsgs(state.chat.messages);
    const m=$('#msgs');m.scrollTop=m.scrollHeight; loadCounts(); loadChatList();
  }catch(e){toast(e.message,'err');}
}
let qrCache=null;
async function handleQR(input){
  const pop=$('#qr-pop'); const val=input.value;
  if(val[0]!=='/'){pop.classList.add('hidden');return;}
  const q=val.slice(1).toLowerCase();
  if(!qrCache){ try{ qrCache=(await api('GET','/api/quick-replies')).quickReplies; }catch(_){qrCache=[];} }
  const matches=qrCache.filter(r=>r.title.toLowerCase().includes(q)||(r.shortcut||'').toLowerCase().includes(q));
  if(!matches.length){pop.classList.add('hidden');return;}
  pop.classList.remove('hidden');
  pop.innerHTML=matches.map(r=>`<div class="qr-item" data-id="${r.id}"><div class="t">${esc(r.title)} ${r.shortcut?`<span class="mut">/${esc(r.shortcut)}</span>`:''}</div><div class="b">${esc(r.body)}</div></div>`).join('');
  $$('.qr-item',pop).forEach(it=>it.onclick=async()=>{
    const r=qrCache.find(x=>String(x.id)===it.dataset.id);
    const ct=state.chat.current;
    input.value=r.body.replace(/\{name\}/g,firstName(ct&&ct.name)); pop.classList.add('hidden'); input.focus();
    input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';
    try{ await api('PATCH','/api/quick-replies/'+r.id,{used:true}); }catch(_){}
  });
}
function renderDetails(){

  const tab=state.chat.tab;

      <div class="drow"><div class="l">Company</div><input class="input" id="d-company" value="${esc(ct.company||'')}"></div>

      <div class="drow"><div class="l">Tags</div><div class="tag-chips" id="d-tags">${(ct.tags||[]).map(t=>`<span class="chip">${esc(t)} <span class="x" data-t="${esc(t)}">✕</span></span>`).join('')||'<span class="mut" style="font-size:12px">No tags</span>'}</div>
        <input class="input" id="d-addtag" placeholder="Add tag + Enter" style="margin-top:8px"></div>`;
    $('#d-stage').onchange=async(e)=>{try{await api('PATCH','/api/contacts/'+ct.id,{stage:e.target.value});ct.stage=e.target.value;toast('Stage updated','ok');loadChatList();}catch(err){toast(err.message,'err');}};

  }else{
    const notes=state.chat.messages.filter(m=>m.direction==='note');

    const d=await api('GET','/api/admin/overview'); const k=d.kpis;
    el.innerHTML=`<div class="page-head"><h1>Clients</h1><button class="btn primary" id="new-client">➕ Create client</button></div>
    <div class="kpis">${kpi('Workspaces',k.workspaces)}${kpi('Active',k.active)}${kpi('Suspended',k.suspended)}${kpi('Total users',k.totalUsers)}${kpi('Total contacts',k.totalContacts)}${kpi('Messages (30d)',k.messages30d)}</div>
    <div class="card"><table class="tbl"><thead><tr><th>Workspace</th><th>Plan</th><th>Status</th><th>Users</th><th>Contacts</th><th>Msgs 30d</th><th>WhatsApp</th><th>Last activity</th><th></th></tr></thead>
      <tbody>${d.companies.map(c=>`<tr>
        <td><b>${esc(c.name)}</b><div class="mut" style="font-size:12px">${esc(c.ownerEmail||'')}</div></td>
        <td><span class="chip">${esc(c.plan)}</span></td>
        <td><span class="chip ${c.status==='active'?'green':'red'}">${esc(c.status)}</span></td>
        <td class="${c.overUsers?'':''}" style="${c.overUsers?'color:var(--red);font-weight:600':''}">${c.users}/${c.maxUsers}</td>
        <td style="${c.overContacts?'color:var(--red);font-weight:600':''}">${c.contacts}/${c.maxContacts}</td>
        <td>${c.messages30d}</td>
        <td>${c.waConnected?'<span class="chip wa">Connected</span>':'<span class="chip amber">Demo</span>'}</td>
        <td class="mut">${c.lastActivity?fmtDate(c.lastActivity):'—'}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn sm" data-imp="${c.id}">Open</button>
          <button class="btn sm" data-edit="${c.id}">Edit</button>
          <button class="btn sm" data-more="${c.id}">⋯</button></td></tr>`).join('')}</tbody></table>
      ${!d.companies.length?'<div class="empty">No client workspaces yet. Create your first client.</div>':''}</div>`;
    const byId=(id)=>d.companies.find(x=>String(x.id)===String(id));
    $$('[data-imp]').forEach(b=>b.onclick=()=>impersonate(b.dataset.imp));
    $$('[data-edit]').forEach(b=>b.onclick=()=>editClientModal(byId(b.dataset.edit),el));
    $$('[data-more]').forEach(b=>b.onclick=()=>moreClientModal(byId(b.dataset.more),el));
    $('#new-client').onclick=()=>newClientModal(el);
  }catch(e){el.innerHTML=errBox(e);}
}
async function impersonate(id){ try{
  if(!state.adminToken){state.adminToken=state.token;localStorage.setItem(LS_ADMIN,state.token);}
  const r=await api('POST','/api/admin/companies/'+id+'/impersonate'); setToken(r.token);
  state.me=await api('GET','/api/me'); location.hash='#/dashboard';state.view='dashboard';renderApp();toast('Now viewing '+r.company.name,'ok');
}catch(e){toast(e.message,'err');} }
function newClientModal(el){
  modal('Create client workspace',`
    <div class="field"><label>Company name</label><input class="input" id="nc-company"></div>
    <div class="field"><label>Owner name</label><input class="input" id="nc-owner"></div>
    <div class="field"><label>Owner email</label><input class="input" id="nc-email" type="email"></div>
    <div class="field"><label>Plan</label><select class="select" id="nc-plan"><option value="trial">Trial</option><option value="starter">Starter</option><option value="pro">Pro</option><option value="business">Business</option></select></div>`,
    [{label:'Cancel',cls:'btn',close:true},{label:'Create client',cls:'btn primary',act:async()=>{
      try{const r=await api('POST','/api/admin/companies',{companyName:$('#nc-company').value.trim(),ownerName:$('#nc-owner').value.trim(),ownerEmail:$('#nc-email').value.trim(),plan:$('#nc-plan').value});
        const cr=r.credentials; showCreds('Client created',cr); viewClients(el);
      }catch(e){toast(e.message,'err');}
    }}]);
}
function showCreds(title,cr){
  modal(title,`<p class="mut" style="margin-top:0">Share these credentials with the client. This password is shown only once.</p>
    <div class="creds"><div class="r"><span>Login URL</span><code>${esc(cr.loginUrl)}</code></div>
      <div class="r"><span>Email</span><code>${esc(cr.email)}</code></div>
      <div class="r"><span>Password</span><code>${esc(cr.password)}</code></div></div>`,
    [{label:'Done',cls:'btn primary',close:true}]);
}
function editClientModal(c,el){
  modal('Edit '+c.name,`
    <div class="field"><label>Plan</label><select class="select" id="e-plan">${['trial','starter','pro','business'].map(p=>`<option value="${p}" ${c.plan===p?'selected':''}>${p}</option>`).join('')}</select><div class="mut" style="font-size:11px;margin-top:4px">Changing the plan resets limits & modules to its defaults unless you override below.</div></div>
    <div class="grid2"><div class="field"><label>Max users</label><input class="input" id="e-users" type="number" value="${c.maxUsers}"></div>
      <div class="field"><label>Max contacts</label><input class="input" id="e-contacts" type="number" value="${c.maxContacts}"></div></div>
    <div class="field"><label>Modules</label><div id="e-mods">${['inbox','contacts','broadcast','templates','automation'].map(m=>`<label style="display:inline-flex;gap:6px;align-items:center;margin:0 12px 8px 0"><input type="checkbox" value="${m}" ${(c.modules||[]).includes(m)?'checked':''}> ${m}</label>`).join('')}</div></div>
    <div class="field"><label>Internal notes</label><textarea class="input" id="e-notes">${esc(c.notes||'')}</textarea></div>`,
    [{label:'Cancel',cls:'btn',close:true},{label:'Save changes',cls:'btn primary',act:async()=>{
      const modules=$$('#e-mods input:checked').map(x=>x.value);
      try{await api('PATCH','/api/admin/companies/'+c.id,{plan:$('#e-plan').value,max_users:parseInt($('#e-users').value,10),max_contacts:parseInt($('#e-contacts').value,10),modules,notes:$('#e-notes').value});closeModal();toast('Client updated','ok');viewClients(el);}catch(e){toast(e.message,'err');}
    }}]);
  // If plan changes, reflect preset limits in the inputs for convenience
  $('#e-plan').onchange=async(e)=>{ try{const plans=(await api('GET','/api/admin/plans')).plans;const p=plans[e.target.value];if(p){$('#e-users').value=p.max_users;$('#e-contacts').value=p.max_contacts;$$('#e-mods input').forEach(x=>x.checked=p.modules.includes(x.value));}}catch(_){}}; 
}
function moreClientModal(c,el){
  modal('Manage '+c.name,`
    <div class="sr-flex" style="flex-direction:column;align-items:stretch;gap:10px">
      <button class="btn" id="m-reset">🔑 Reset owner password</button>
      <button class="btn" id="m-suspend">${c.status==='active'?'⏸ Suspend workspace':'▶ Reactivate workspace'}</button>
      <button class="btn danger" id="m-delete">🗑 Delete workspace</button>
    </div>`,[{label:'Close',cls:'btn',close:true}]);
  $('#m-reset').onclick=async()=>{try{const r=await api('POST','/api/admin/companies/'+c.id+'/reset-password');showCreds('Password reset',{loginUrl:location.origin+'/',email:r.email,password:r.password});}catch(e){toast(e.message,'err');}};
  $('#m-suspend').onclick=async()=>{try{await api('PATCH','/api/admin/companies/'+c.id,{status:c.status==='active'?'suspended':'active'});closeModal();toast('Updated','ok');viewClients(el);}catch(e){toast(e.message,'err');}};
  $('#m-delete').onclick=()=>{ modal('Delete '+c.name,`<p>This permanently deletes the workspace and <b>all its data</b>. This cannot be undone.</p>
    <div class="field"><label>Type the workspace name to confirm</label><input class="input" id="del-confirm" placeholder="${esc(c.name)}"></div>`,
    [{label:'Cancel',cls:'btn',close:true},{label:'Delete forever',cls:'btn danger',act:async()=>{const v=$('#del-confirm').value;
      try{await api('DELETE','/api/admin/companies/'+c.id+'?confirm='+encodeURIComponent(v));closeModal();toast('Workspace deleted','ok');viewClients(el);}catch(e){toast(e.message,'err');}}}]); };
}

/* ============================ Platform: Settings ============================ */
async function viewPlatformSettings(el){
  try{
    const s=await api('GET','/api/admin/settings'); const plans=(await api('GET','/api/admin/plans')).plans;
    el.innerHTML=`<div class="page-head"><h1>Platform settings</h1></div>
      <div class="card pad" style="margin-bottom:18px"><div class="sr-flex" style="justify-content:space-between">
        <div><div style="font-weight:600">Public sign-up</div><div class="mut" style="font-size:12px">When on, anyone can self-register a new workspace.</div></div>
        <div class="toggle ${s.registrationOpen?'on':''}" id="reg-toggle"></div></div></div>
      <div class="card pad" style="margin-bottom:18px"><div style="font-weight:600;margin-bottom:10px">Platform</div>
        <div class="creds"><div class="r"><span>Platform owner email</span><code>${esc(s.superAdminEmail)}</code></div>
        <div class="r"><span>Client login URL</span><code>${esc(s.loginUrl)}</code></div></div></div>
      <div class="card pad"><div style="font-weight:600;margin-bottom:10px">Plan presets</div>
        <table class="tbl"><thead><tr><th>Plan</th><th>Max users</th><th>Max contacts</th><th>Modules</th></tr></thead>
        <tbody>${Object.entries(plans).map(([name,p])=>`<tr><td><span class="chip">${name}</span></td><td>${p.max_users}</td><td>${p.max_contacts.toLocaleString()}</td><td>${p.modules.map(m=>`<span class="chip">${m}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>`;
    $('#reg-toggle').onclick=async(e)=>{const cur=e.target.classList.contains('on');try{const r=await api('PATCH','/api/admin/settings',{registrationOpen:!cur});e.target.classList.toggle('on',r.registrationOpen);toast('Updated','ok');}catch(err){toast(err.message,'err');}};
  }catch(e){el.innerHTML=errBox(e);}
}

/* ============================ Modal helper ============================ */
function modal(title,bodyHtml,buttons){
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal-back" id="modal-back"><div class="modal ${buttons&&buttons._wide?'wide':''}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="x-close" id="modal-x">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot" id="modal-foot"></div></div></div>`;
  const foot=$('#modal-foot');
  (buttons||[{label:'Close',cls:'btn',close:true}]).forEach(b=>{const btn=document.createElement('button');btn.className=b.cls;btn.textContent=b.label;
    btn.onclick=async()=>{ if(b.act){btn.disabled=true;try{await b.act();}catch(e){toast(e.message,'err');}btn.disabled=false;} if(b.close)closeModal(); };
    foot.appendChild(btn);});
  $('#modal-x').onclick=closeModal;
  $('#modal-back').onclick=(e)=>{if(e.target.id==='modal-back')closeModal();};
}
function closeModal(){$('#modal-root').innerHTML='';}
</script>
